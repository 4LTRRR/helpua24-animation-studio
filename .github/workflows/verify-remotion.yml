name: Verify Remotion project and render episode

on:
  push:
    paths:
      - "name/**"
      - ".github/workflows/verify-remotion.yml"
  workflow_dispatch:

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: name
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: name/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Run lint and TypeScript checks
        run: npm run lint

      - name: Build Remotion bundle
        run: npm run build

      - name: Render episode 01
        run: |
          mkdir -p out
          npx remotion render src/index.ts Episode-01-Raport out/episode-01-raport.mp4 --codec=h264 --crf=20 --pixel-format=yuv420p --concurrency=2

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: episode-01-raport-mp4
          path: name/out/episode-01-raport.mp4
          if-no-files-found: error
          retention-days: 14
