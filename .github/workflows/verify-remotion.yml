name: Verify Remotion project

on:
  push:
    paths:
      - "name/**"
      - ".github/workflows/verify-remotion.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: name
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: name/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint and TypeScript checks
        run: npm run lint

      - name: Build Remotion bundle
        run: npm run build
