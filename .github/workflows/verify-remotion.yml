name: Verify Remotion project and render full episode

on:
  push:
    paths:
      - "name/**"
      - ".github/workflows/verify-remotion.yml"
  workflow_dispatch:

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: name
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: name/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Run lint and TypeScript checks
        run: npm run lint

      - name: Build Remotion bundle
        run: npm run build

      - name: Render full episode 01
        run: |
          mkdir -p out
          npx remotion render src/index.ts Episode-01-Raport out/episode-01-full.mp4 --codec=h264 --crf=17 --pixel-format=yuv420p --concurrency=2

      - name: Render full episode 02
        run: npx remotion render src/index.ts Episode-02-Who-Registered out/episode-02-full.mp4 --codec=h264 --crf=17 --pixel-format=yuv420p --concurrency=2

      - name: Render full episode 03
        run: npx remotion render src/index.ts Episode-03-Final out/episode-03-final.mp4 --codec=h264 --crf=17 --pixel-format=yuv420p --concurrency=2

      - name: Render full episode 04
        run: npx remotion render src/index.ts Episode-04-He-Could-Not-Be-There out/episode-04-final.mp4 --codec=h264 --crf=17 --pixel-format=yuv420p --concurrency=2

      - name: Upload full episode MP4
        uses: actions/upload-artifact@v4
        with:
          name: episode-01-full
          path: name/out/episode-01-full.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload full episode 02 MP4
        uses: actions/upload-artifact@v4
        with:
          name: episode-02-full
          path: name/out/episode-02-full.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload final episode 03 MP4
        uses: actions/upload-artifact@v4
        with:
          name: episode-03-final
          path: name/out/episode-03-final.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload final episode 04 MP4
        uses: actions/upload-artifact@v4
        with:
          name: episode-04-final
          path: name/out/episode-04-final.mp4
          if-no-files-found: error
          retention-days: 14
